[workspace]
members = [
    "crates/libs/numtypes",
    "crates/libs/numcore",
    "crates/libs/moltopo",
    "crates/libs/pgraph",
    "crates/libs/spacc",
    "crates/libs/molff",
    "crates/libs/oclff",
    "crates/libs/surfff",
    "crates/libs/surfmol",
    "crates/libs/molrender",
    "crates/libs/molgui",
    "crates/apps/buildff",
    "crates/apps/molengine",
    "crates/apps/editor",
    "crates/apps/molbrowser",
]
resolver = "2"

[workspace.package]
license = "MIT"
repository = "https://github.com/ProkopHapala/SurfMol"
edition = "2021"

[workspace.dependencies]
# Internal crates
numtypes = { path = "crates/libs/numtypes" }
numcore = { path = "crates/libs/numcore" }
moltopo = { path = "crates/libs/moltopo" }
pgraph = { path = "crates/libs/pgraph" }
spacc = { path = "crates/libs/spacc" }
molff = { path = "crates/libs/molff" }
surfff = { path = "crates/libs/surfff" }
oclff = { path = "crates/libs/oclff" }
surfmol = { path = "crates/libs/surfmol" }
molrender = { path = "crates/libs/molrender" }
molgui = { path = "crates/libs/molgui" }

# External crates
bytemuck = { version = "1.21", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wgpu = "29"
pollster = "0.4"
winit = "0.30"
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.34"
egui-winit = { version = "0.34", default-features = false, features = ["wayland", "x11", "links"] }
egui-wgpu = "0.34"
glam = "0.29"
ndarray = "0.16"
rand = "0.8"
ocl = "0.19"
rhai = "1.19"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
arboard = { version = "3.6", default-features = false }

# --- Build profiles (ported from blood_of_civilization/doc/AGENTS/notes/Memory_Issues/reduce_target_footprint_plan.md A1) ---
# debug=1: line tables only (backtraces keep file:line at panic site + function names), drops variable debug info
# strip="debuginfo": strips .debug_line/.debug_info/.debug_str from binaries (~16x smaller debug binaries), .eh_frame survives for backtraces
[profile.dev]
debug = 1
strip = "debuginfo"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
incremental = true
debug-assertions = true
overflow-checks = true
strip = "debuginfo"
