[package]
name = "editor"
version = "0.1.0"
edition = "2021"
description = "3D molecular editor with hex-grid Kekule editing, MD relaxation, surface visualization"

[[bin]]
name = "editor"
path = "src/main.rs"

[dependencies]
surfmol = { workspace = true }
molff = { workspace = true }
surfff = { workspace = true }
moltopo = { workspace = true }
numcore = { workspace = true }
molgui = { workspace = true }
molrender = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
winit = { workspace = true }
egui = { workspace = true }
egui-winit = { workspace = true }
egui-wgpu = { workspace = true }
glam = { workspace = true }
arboard = { workspace = true }
