[package]
name = "surfmol-forcefields"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/forcefields.rs"

[[bin]]
name = "mol_engine"
path = "src/mol_engine.rs"

[dependencies]
surfmol-common = { path = "../common" }
surfmol-topology = { path = "../topology" }
rhai = "1.19"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ndarray = { workspace = true }
