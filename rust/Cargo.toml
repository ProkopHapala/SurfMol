[workspace]
members = [
    "apps",
    "common",
    "forcefields",
    "topology",
    "molrender",
]
resolver = "2"

[workspace.dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.34"
egui-winit = "0.34"
egui-wgpu = "0.34"
egui_plot = "0.34"
ndarray = "0.16"
nalgebra = "0.33"
rand = "0.8"
ocl = "0.19"
wgpu = "29"
pollster = "0.4"
bytemuck = { version = "1.21", features = ["derive"] }
winit = "0.30"
glam = "0.29"
